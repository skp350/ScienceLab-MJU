name: Auto Fetch Facebook 6 Posts

on:
  schedule:
    - cron: '0 */6 * * *' # รันอัตโนมัติทุกๆ 6 ชั่วโมง
  workflow_dispatch:      # กดปุ่ม Run เองได้ทันทีในแท็บ Actions

permissions:
  contents: write

jobs:
  scrape-facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Direct Facebook Scraper (6 Posts)
        run: node fetch.js

      - name: Commit & Push updated posts and images
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posts.json images/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 6 Facebook posts" && git push)
