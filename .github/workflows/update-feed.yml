name: Auto Fetch Facebook Posts & Images

on:
  schedule:
    - cron: '0 */6 * * *' # รันทุก 6 ชั่วโมง ป้องกันลิงก์ RSS หมดอายุ 7 วัน และอัปเดตข่าวอัตโนมัติ
  workflow_dispatch:      # กดปุ่ม Run workflow เองได้ตลอดเวลา

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script (Download Images & Update JSON)
        run: node fetch.js

      - name: Commit & Push updated posts.json and images/ folder
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posts.json images/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Facebook posts and images" && git push)
