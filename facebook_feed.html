<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Facebook 6 Feeds - ศูนย์บริการวิชาการด้านวิทยาศาสตร์และเทคโนโลยี คณะวิทยาศาสตร์ ม.แม่โจ้</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: transparent;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }

        .feed-container-6 {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .news-card-6 {
            width: calc(33.333% - 8px);
            background: #ffffff;
            border: 1px solid #fed7aa;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 430px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .news-card-6:hover {
            transform: translateY(-3px);
            border-color: #ea580c;
            box-shadow: 0 8px 18px rgba(234, 88, 12, 0.14);
        }

        .card-img-wrapper {
            width: 100%;
            height: 265px;
            background: #fff7ed;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .card-content {
            padding: 12px 14px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .author-info {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 8px;
        }

        /* รูปแบบวันที่สีส้มแบบเต็ม */
        .author-date {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            color: #ea580c;
            background-color: #fff7ed;
            border: 1px solid #fed7aa;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        .card-text {
            font-size: 12px;
            color: #334155;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .read-more {
            font-size: 11.5px;
            color: #ea580c;
            font-weight: 700;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .news-card-6 {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <div class="feed-container-6" id="feed-container"></div>

    <script>
        const fbPageUrl = 'https://www.facebook.com/ScienceAcademicServiceMJU';
        const defaultFallbackImg = 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=600&auto=format&fit=crop&q=80';

        // ฟังก์ชันแปลงวันที่เป็นรูปแบบเต็มภาษาไทย เช่น "29 ตุลาคม 2569"
        function formatFullThaiDate(dateInput) {
            if (!dateInput) return 'ข่าวประชาสัมพันธ์ล่าสุด';
            const d = new Date(dateInput);
            if (isNaN(d.getTime())) return dateInput;
            return d.toLocaleDateString('th-TH', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function fixFbLink(url) {
            if (!url) return fbPageUrl;
            const isMobileOrTablet = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            let cleanUrl = url.replace(/facebook\.com\/\d+\/posts\//, 'facebook.com/ScienceAcademicServiceMJU/posts/');

            if (isMobileOrTablet && cleanUrl.includes('/posts/')) {
                return fbPageUrl;
            }
            return cleanUrl;
        }

        function renderFeeds(items) {
            const posts = (items || []).slice(0, 6);
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            posts.forEach((post) => {
                const fullDateStr = formatFullThaiDate(post.pubDate);
                const imgSrc = post.thumbnail || defaultFallbackImg;
                const liveFallback = post.liveImgUrl || defaultFallbackImg;
                const targetLink = fixFbLink(post.link);

                container.innerHTML += `
            <a href="${targetLink}" target="_blank" class="news-card-6">
              <div class="card-img-wrapper">
                <img class="card-img" src="${imgSrc}" referrerpolicy="no-referrer" alt="Card Image"
                     onerror="if(!this.dataset.triedLive && '${liveFallback}' !== '${defaultFallbackImg}'){this.dataset.triedLive='1';this.src='${liveFallback}';}else{this.onerror=null;this.src='${defaultFallbackImg}';}">
              </div>
              <div class="card-content">
                <div>
                  <div class="author-info">
                    <span class="author-date">📅 ${fullDateStr}</span>
                  </div>
                  <p class="card-text">${post.description}</p>
                </div>
                <div>
                  <span class="read-more">อ่านรายละเอียดเพิ่มเติม ➔</span>
                </div>
              </div>
            </a>
          `;
            });
        }

        fetch('posts.json?t=' + Date.now())
            .then(res => res.ok ? res.json() : [])
            .then(data => renderFeeds(data))
            .catch(() => renderFeeds([]));
    </script>
</body>

</html>
