<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>ไฮไลท์ - ศูนย์บริการวิชาการฯ คณะวิทยาศาสตร์ ม.แม่โจ้</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: transparent;
            padding: 2px 2px 4px 2px;
            margin: 0;
            overflow: hidden;
        }

        /* 1. หัวข้อ "ไฮไลท์" แบบคลีน ไม่มีไอคอน */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #fed7aa;
        }

        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: #1e293b;
            border-left: 4px solid #ea580c;
            padding-left: 10px;
            line-height: 1.2;
        }

        .btn-view-all {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #ffffff;
            color: #ea580c;
            border: 1px solid #fdba74;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-view-all:hover {
            background: #ea580c;
            color: #ffffff;
            border-color: #ea580c;
        }

        /* 2. ตารางการ์ด 6 ข่าว เรียงแถวเดียว (6 คอลัมน์) */
        .feed-container-6-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            width: 100%;
        }

        .news-card-item {
            width: 100%;
            background: #ffffff;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .news-card-item:hover {
            transform: translateY(-3px);
            border-color: #ea580c;
            box-shadow: 0 8px 15px rgba(234, 88, 12, 0.14);
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff7ed;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 15%;
            display: block;
            transition: transform 0.3s ease;
        }

        .news-card-item:hover .card-img {
            transform: scale(1.04);
        }

        .author-date-badge {
            position: absolute;
            z-index: 3;
            bottom: 6px;
            right: 6px;
            font-size: 9.5px;
            color: #ffffff;
            background-color: rgba(234, 88, 12, 0.92);
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 600;
        }

        .card-content {
            padding: 8px 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
            min-height: 92px;
        }

        .card-text {
            font-size: 11px;
            color: #334155;
            line-height: 1.42;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .read-more {
            font-size: 10.5px;
            color: #ea580c;
            font-weight: 700;
            display: inline-block;
        }

        /* การ์ดช่องที่ 6 โทนขาว-ส้ม-เขียวแม่โจ้ */
        .promo-card-compact {
            background: linear-gradient(180deg, #fff7ed 0%, #ffffff 100%);
            border: 1px solid #fdba74;
            border-top: 4px solid #006837;
            padding: 12px 11px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .promo-tag {
            display: inline-block;
            font-size: 9.5px;
            font-weight: 700;
            color: #006837;
            background: #dcfce7;
            padding: 2px 7px;
            border-radius: 10px;
            margin-bottom: 5px;
            width: fit-content;
        }

        .promo-title {
            font-size: 12.5px;
            font-weight: 800;
            color: #1e293b;
            line-height: 1.3;
            margin-bottom: 3px;
        }

        .promo-desc {
            font-size: 10.5px;
            color: #ea580c;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .promo-info {
            background: #ffffff;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 10px;
            color: #334155;
            line-height: 1.48;
            margin-bottom: 6px;
        }

        .promo-info strong {
            color: #006837;
        }

        .promo-btn {
            background: linear-gradient(90deg, #ea580c, #f97316);
            color: #ffffff;
            font-size: 10.5px;
            font-weight: 700;
            text-align: center;
            padding: 6px 8px;
            border-radius: 6px;
        }

        @media (max-width: 1024px) {
            .feed-container-6-row {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .feed-container-6-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="section-header">
        <h2 class="section-title">ข่าวประชาสัมพันธ์</h2>
        <a href="https://www.facebook.com/ScienceAcademicServiceMJU" target="_blank" class="btn-view-all">
            <span>ดูทั้งหมด</span>
            <span>➔</span>
        </a>
    </div>

    <div class="feed-container-6-row" id="feed-container"></div>

    <script>
        const fbPageUrl = 'https://www.facebook.com/ScienceAcademicServiceMJU';
        const defaultFallbackImg = 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=600&auto=format&fit=crop&q=80';

        // ฟังก์ชันส่งความสูงจริงของหน้าเว็บไปให้ Iframe แม่โจ้ปรับความสูงอัตโนมัติ
        function sendFeedHeight() {
            const h = document.body.scrollHeight;
            window.parent.postMessage({ type: 'scilabFeedHeight', height: h }, '*');
        }

        function formatFullThaiDate(dateInput) {
            if (!dateInput) return 'ล่าสุด';
            const d = new Date(dateInput);
            if (isNaN(d.getTime())) return dateInput;
            return d.toLocaleDateString('th-TH', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function fixFbLink(url) {
            if (!url) return fbPageUrl;
            const isMobileOrTablet = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            let cleanUrl = url.replace(/facebook\.com\/\d+\/posts\//, 'facebook.com/ScienceAcademicServiceMJU/posts/');

            if (isMobileOrTablet && cleanUrl.includes('/posts/')) {
                return fbPageUrl;
            }
            return cleanUrl;
        }

        function renderFeeds(items) {
            const posts = (items || []).slice(0, 5);
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            posts.forEach((post) => {
                const fullDateStr = formatFullThaiDate(post.pubDate);
                const imgSrc = post.thumbnail || defaultFallbackImg;
                const liveFallback = post.liveImgUrl || defaultFallbackImg;
                const targetLink = fixFbLink(post.link);

                container.innerHTML += `
            <a href="${targetLink}" target="_blank" class="news-card-item">
              <div class="card-img-wrapper">
                <img class="card-img" src="${imgSrc}" referrerpolicy="no-referrer" alt="Card Image"
                     onload="sendFeedHeight()"
                     onerror="if(!this.dataset.triedLive && '${liveFallback}' !== '${defaultFallbackImg}'){this.dataset.triedLive='1';this.src='${liveFallback}';}else{this.onerror=null;this.src='${defaultFallbackImg}';} sendFeedHeight();">
                <span class="author-date-badge">${fullDateStr}</span>
              </div>
              <div class="card-content">
                <p class="card-text">${post.description}</p>
                <div>
                  <span class="read-more">อ่านเพิ่มเติม ➔</span>
                </div>
              </div>
            </a>
          `;
            });

            container.innerHTML += `
            <a href="${fbPageUrl}" target="_blank" class="news-card-item promo-card-compact">
              <div>
                <span class="promo-tag">ข้อมูลติดต่อศูนย์ฯ</span>
                <h3 class="promo-title">ศูนย์บริการวิชาการด้านวิทยาศาสตร์และเทคโนโลยี</h3>
                <p class="promo-desc">คณะวิทยาศาสตร์ ม.แม่โจ้</p>
                <div class="promo-info">
                  <strong>สถานที่ตั้ง:</strong> ชั้น 1 อาคารแม่โจ้ 60 ปี<br>
                  <strong>เวลาทำการ:</strong> จ.-ศ. (08:30-16:30 น.)<br>
                  <strong>โทร:</strong> 053-873-812<br>
                  <strong>LINE ID:</strong> @efn4994d
                </div>
              </div>
              <div class="promo-btn">
                ติดตามเพจ Facebook ➔
              </div>
            </a>
          `;

            sendFeedHeight();
            setTimeout(sendFeedHeight, 300);
            setTimeout(sendFeedHeight, 1000);
        }

        window.addEventListener('resize', sendFeedHeight);

        fetch('posts.json?t=' + Date.now())
            .then(res => res.ok ? res.json() : [])
            .then(data => renderFeeds(data))
            .catch(() => renderFeeds([]));
    </script>
</body>

</html>
