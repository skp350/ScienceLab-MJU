<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>ข่าวประชาสัมพันธ์ 4 ข่าวล่าสุด - ศูนย์บริการวิชาการฯ คณะวิทยาศาสตร์ ม.แม่โจ้</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: transparent;
            padding: 2px 2px 6px 2px;
            margin: 0;
            overflow-x: hidden;
        }

        /* 1. แถบหัวข้อข่าวประชาสัมพันธ์ */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            padding: 10px 14px;
            background: linear-gradient(90deg, #fff7ed 0%, #ffffff 100%);
            border: 1px solid #fed7aa;
            border-left: 5px solid #ea580c;
            border-radius: 10px;
        }

        .section-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            width: 34px;
            height: 34px;
            background: #ea580c;
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(234, 88, 12, 0.25);
        }

        .section-title {
            font-size: 16.5px;
            font-weight: 700;
            color: #1e293b;
            line-height: 1.2;
        }

        .section-subtitle {
            font-size: 11.5px;
            color: #64748b;
            margin-top: 1px;
        }

        .btn-view-all {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #ffffff;
            color: #ea580c;
            border: 1px solid #fdba74;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-view-all:hover {
            background: #ea580c;
            color: #ffffff;
            border-color: #ea580c;
        }

        /* 2. ตารางการ์ดข่าว 4 คอลัมน์ (แถวเดียว 4 ข่าวล่าสุด) */
        .feed-container-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
        }

        .news-card-4 {
            width: 100%;
            background: #ffffff;
            border: 1px solid #fed7aa;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        }

        .news-card-4:hover {
            transform: translateY(-4px);
            border-color: #ea580c;
            box-shadow: 0 10px 18px rgba(234, 88, 12, 0.14);
        }

        /* กรอบรูปภาพสัดส่วนจัตุรัส 1:1 พอดีกับรูป Facebook เต็มการ์ด ไม่ตัดหัวไม่ตัดขอบ */
        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #fff7ed;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform 0.35s ease;
        }

        .news-card-4:hover .card-img {
            transform: scale(1.04);
        }

        /* ป้ายวันที่สีส้ม */
        .author-date-badge {
            position: absolute;
            z-index: 3;
            bottom: 8px;
            right: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10.5px;
            color: #ffffff;
            background-color: rgba(234, 88, 12, 0.92);
            backdrop-filter: blur(4px);
            padding: 2.5px 9px;
            border-radius: 20px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .card-content {
            padding: 12px 13px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
            min-height: 115px;
        }

        .card-text {
            font-size: 12px;
            color: #334155;
            line-height: 1.48;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .read-more {
            font-size: 11.5px;
            color: #ea580c;
            font-weight: 700;
            display: inline-block;
        }

        /* รองรับหน้าจอ Tablet / iPad (2 คอลัมน์) */
        @media (max-width: 900px) {
            .feed-container-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* รองรับหน้าจอมือถือ (Mobile - 1 คอลัมน์) */
        @media (max-width: 560px) {
            .section-header {
                padding: 10px 12px;
            }
            .btn-view-all {
                width: 100%;
                justify-content: center;
            }
            .feed-container-4 {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- 1. หัวข้อข่าวประชาสัมพันธ์ -->
    <div class="section-header">
        <div class="section-title-group">
            <div class="section-icon">📢</div>
            <div>
                <h2 class="section-title">ข่าวประชาสัมพันธ์และกิจกรรมล่าสุด</h2>
                <p class="section-subtitle">อัปเดตข่าวสาร การให้บริการเครื่องมือวิทยาศาสตร์ และกิจกรรมจากเพจทางการ</p>
            </div>
        </div>
        <a href="https://www.facebook.com/ScienceAcademicServiceMJU" target="_blank" class="btn-view-all">
            <span>ดูทั้งหมดบน Facebook</span>
            <span>➔</span>
        </a>
    </div>

    <!-- 2. ตารางแสดงการ์ดข่าว 4 ช่อง (แถวเดียว) -->
    <div class="feed-container-4" id="feed-container"></div>

    <script>
        const fbPageUrl = 'https://www.facebook.com/ScienceAcademicServiceMJU';
        const defaultFallbackImg = 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=600&auto=format&fit=crop&q=80';

        function formatFullThaiDate(dateInput) {
            if (!dateInput) return 'ข่าวล่าสุด';
            const d = new Date(dateInput);
            if (isNaN(d.getTime())) return dateInput;
            return d.toLocaleDateString('th-TH', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function fixFbLink(url) {
            if (!url) return fbPageUrl;
            const isMobileOrTablet = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            let cleanUrl = url.replace(/facebook\.com\/\d+\/posts\//, 'facebook.com/ScienceAcademicServiceMJU/posts/');

            if (isMobileOrTablet && cleanUrl.includes('/posts/')) {
                return fbPageUrl;
            }
            return cleanUrl;
        }

        function renderFeeds(items) {
            // ตัดเอา 4 ข่าวล่าสุดมาแสดงในแถวเดียว
            const posts = (items || []).slice(0, 4);
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            posts.forEach((post) => {
                const fullDateStr = formatFullThaiDate(post.pubDate);
                const imgSrc = post.thumbnail || defaultFallbackImg;
                const liveFallback = post.liveImgUrl || defaultFallbackImg;
                const targetLink = fixFbLink(post.link);

                container.innerHTML += `
            <a href="${targetLink}" target="_blank" class="news-card-4">
              <div class="card-img-wrapper">
                <img class="card-img" src="${imgSrc}" referrerpolicy="no-referrer" alt="Card Image"
                     onerror="if(!this.dataset.triedLive && '${liveFallback}' !== '${defaultFallbackImg}'){this.dataset.triedLive='1';this.src='${liveFallback}';}else{this.onerror=null;this.src='${defaultFallbackImg}';}">
                <span class="author-date-badge">📅 ${fullDateStr}</span>
              </div>
              <div class="card-content">
                <p class="card-text">${post.description}</p>
                <div>
                  <span class="read-more">อ่านรายละเอียดเพิ่มเติม ➔</span>
                </div>
              </div>
            </a>
          `;
            });
        }

        fetch('posts.json?t=' + Date.now())
            .then(res => res.ok ? res.json() : [])
            .then(data => renderFeeds(data))
            .catch(() => renderFeeds([]));
    </script>
</body>

</html>
